#
# Description: Reusable workflow for VneCrossWindow — configure, build, test,
# optional coverage. Build tree matches vneio: build/<shared|static>/<Release|Debug>/...
# Called only by ci.yml.
#
# Autodoc:   yes
# ----------------------------------------------------------------------

name: "Build and Test (Reusable)"

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub-hosted runner label (e.g. ubuntu-latest)"
        required: true
        type: string
      c_compiler:
        description: "C compiler to use (empty = runner default)"
        required: false
        type: string
        default: ""
      cpp_compiler:
        description: "C++ compiler to use (empty = runner default)"
        required: false
        type: string
        default: ""
      platform:
        description: "Platform identifier used as cache key discriminator"
        required: true
        type: string
      build_type:
        description: "CMake build type: Release or Debug"
        required: false
        type: string
        default: "Release"
      enable_coverage:
        description: "Enable lcov coverage and Codecov upload (Linux only)"
        required: false
        type: boolean
        default: false
      warnings_as_errors:
        description: "Enable -DWARNINGS_AS_ERRORS=ON"
        required: false
        type: boolean
        default: true
      extra_cmake_flags:
        description: "Extra CMake -D flags (e.g. -DENABLE_ASAN=ON -DENABLE_IPO=OFF)"
        required: false
        type: string
        default: ""
      lib_type:
        description: "Library type: static or shared (default shared)"
        required: false
        type: string
        default: ""
      linux_extra_apt_packages:
        description: "Additional apt packages on Linux (space-separated, e.g. Wayland dev libs)"
        required: false
        type: string
        default: ""
    secrets:
      codecov_token:
        description: "Codecov upload token (when enable_coverage is true)"
        required: false

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: "Build + Test (${{ inputs.platform }}, ${{ inputs.build_type }}${{ format(', {0}', inputs.lib_type || 'shared') }})"
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Use HTTPS for GitHub (CI runners have no SSH key)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26 (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Set effective build type and cache key
        shell: bash
        env:
          BUILD_TYPE:      ${{ inputs.build_type }}
          ENABLE_COVERAGE: ${{ inputs.enable_coverage }}
          LIB_TYPE:        ${{ inputs.lib_type == '' && 'shared' || inputs.lib_type }}
          RUNNER_OS:       ${{ runner.os }}
        run: |
          echo "EFFECTIVE_BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          if [[ "$ENABLE_COVERAGE" == "true" ]]; then
              echo "CACHE_BUILD_TYPE=${BUILD_TYPE}-coverage" >> "$GITHUB_ENV"
          else
              echo "CACHE_BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          fi
          EFFECTIVE_LIB_TYPE="shared"
          if [[ "$LIB_TYPE" == "static" ]]; then
              EFFECTIVE_LIB_TYPE="static"
          elif [[ -n "$LIB_TYPE" && "$LIB_TYPE" != "shared" ]]; then
              echo "::error::Invalid lib_type '${LIB_TYPE}'. Expected '', 'shared', or 'static'."
              exit 1
          fi
          echo "CACHE_LIB_TYPE=$EFFECTIVE_LIB_TYPE" >> "$GITHUB_ENV"
          echo "BUILD_DIR=build/$EFFECTIVE_LIB_TYPE/$BUILD_TYPE" >> "$GITHUB_ENV"

      - name: Cache CMake build
        if: ${{ !inputs.enable_coverage }}
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: build-${{ inputs.platform }}-${{ env.CACHE_BUILD_TYPE }}-${{ env.CACHE_LIB_TYPE }}-${{ hashFiles('CMakeLists.txt') }}-${{ hashFiles('**/CMakeLists.txt') }}-${{ hashFiles('.gitmodules') }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            build-${{ inputs.platform }}-${{ env.CACHE_BUILD_TYPE }}-${{ env.CACHE_LIB_TYPE }}-
            build-${{ inputs.platform }}-${{ env.CACHE_BUILD_TYPE }}-
            build-${{ inputs.platform }}-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        env:
          EXTRA_APT: ${{ inputs.linux_extra_apt_packages }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake libx11-dev ${EXTRA_APT}

      - name: Install lcov (coverage builds only)
        if: runner.os == 'Linux' && inputs.enable_coverage
        run: sudo apt-get install -y lcov

      - name: Clean build directory (coverage only)
        if: inputs.enable_coverage
        shell: bash
        run: rm -rf ${{ env.BUILD_DIR }}

      - name: Configure CMake
        shell: bash
        env:
          ENABLE_COVERAGE: ${{ inputs.enable_coverage }}
          C_COMPILER:      ${{ inputs.c_compiler }}
          CPP_COMPILER:    ${{ inputs.cpp_compiler }}
          EXTRA_FLAGS:     ${{ inputs.extra_cmake_flags }}
          WAE:             ${{ inputs.warnings_as_errors && 'ON' || 'OFF' }}
          PLATFORM_ID:     ${{ inputs.platform }}
        run: |
          COVERAGE_FLAG=""
          if [[ "$ENABLE_COVERAGE" == "true" ]]; then
              COVERAGE_FLAG="-DENABLE_COVERAGE=ON"
          fi

          # Cache hygiene: if the restored build cache belongs to a different source
          # checkout path (e.g. repository rename), CMake will fail hard. Detect and
          # reset that cache directory before configuring.
          if [[ -f "$BUILD_DIR/CMakeCache.txt" ]]; then
              CACHED_SRC="$(sed -n 's|^CMAKE_HOME_DIRECTORY:INTERNAL=||p' "$BUILD_DIR/CMakeCache.txt" | head -n1)"
              if [[ -n "$CACHED_SRC" && "$CACHED_SRC" != "$GITHUB_WORKSPACE" ]]; then
                  echo "::warning::Stale CMake cache source path detected."
                  echo "::warning::Cached: $CACHED_SRC"
                  echo "::warning::Current: $GITHUB_WORKSPACE"
                  echo "::warning::Removing stale build cache at $BUILD_DIR"
                  rm -rf "$BUILD_DIR"
              fi
          fi

          COMPILER_FLAGS=""
          if [[ -n "$C_COMPILER" ]]; then
              COMPILER_FLAGS="-DCMAKE_C_COMPILER=$C_COMPILER"
          fi
          if [[ -n "$CPP_COMPILER" ]]; then
              if [[ -n "$COMPILER_FLAGS" ]]; then
                  COMPILER_FLAGS+=" -DCMAKE_CXX_COMPILER=$CPP_COMPILER"
              else
                  COMPILER_FLAGS="-DCMAKE_CXX_COMPILER=$CPP_COMPILER"
              fi
          fi

          if [[ "$CACHE_LIB_TYPE" == "static" ]]; then
              LIB_TYPE_FLAGS="-DVNE_XWIN_LIB_TYPE=static"
          else
              LIB_TYPE_FLAGS="-DVNE_XWIN_LIB_TYPE=shared"
          fi

          IPO_OFF=""
          if [[ "$PLATFORM_ID" == "linux-clang" || "$PLATFORM_ID" == "linux-asan" ]]; then
              IPO_OFF="-DENABLE_IPO=OFF"
          fi

          PREFIX_FLAGS=""
          if [[ "${{ runner.os }}" == "macOS" ]]; then
              PREFIX_FLAGS="-DCMAKE_PREFIX_PATH=$(brew --prefix)"
          fi

          # shellcheck disable=SC2086
          cmake -B "$BUILD_DIR" -S . \
            -DCMAKE_BUILD_TYPE="$EFFECTIVE_BUILD_TYPE" \
            -DVNE_XWIN_CI=ON \
            -DVNE_XWIN_EXAMPLES=OFF \
            -DWARNINGS_AS_ERRORS="$WAE" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            ${COVERAGE_FLAG} \
            ${LIB_TYPE_FLAGS} \
            ${COMPILER_FLAGS} \
            ${PREFIX_FLAGS} \
            ${IPO_OFF} \
            ${EXTRA_FLAGS}

      - name: Build
        shell: bash
        run: cmake --build "$BUILD_DIR" --config "$EFFECTIVE_BUILD_TYPE" --parallel

      - name: Verify coverage instrumentation (coverage only, Linux)
        if: runner.os == 'Linux' && inputs.enable_coverage
        shell: bash
        run: |
          GCNO_COUNT=$(find "$BUILD_DIR" -name "*.gcno" | wc -l)
          echo "Total .gcno files: $GCNO_COUNT"
          if [[ "$GCNO_COUNT" -eq 0 ]]; then
              echo "::error::No .gcno files found — check ENABLE_COVERAGE."
              exit 1
          fi

      - name: Test
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          ctest \
            --output-on-failure \
            --output-junit test-results.xml \
            -C "$EFFECTIVE_BUILD_TYPE"

      - name: Verify .gcda (coverage only, Linux)
        if: runner.os == 'Linux' && inputs.enable_coverage
        shell: bash
        run: |
          GCDA_COUNT=$(find "$BUILD_DIR" -name "*.gcda" | wc -l)
          echo "Total .gcda files: $GCDA_COUNT"
          if [[ "$GCDA_COUNT" -eq 0 ]]; then
              echo "::error::No .gcda files after tests."
              exit 1
          fi

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "${{ env.BUILD_DIR }}/test-results.xml"
          check_name: "Tests (${{ inputs.platform }}, ${{ env.EFFECTIVE_BUILD_TYPE }}${{ format(', {0}', inputs.lib_type || 'shared') }})"
          fail_on_failure: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ inputs.platform }}-${{ env.EFFECTIVE_BUILD_TYPE }}-${{ inputs.lib_type || 'shared' }}
          path: ${{ env.BUILD_DIR }}/test-results.xml
          retention-days: 7

      - name: Write test summary
        if: always()
        shell: bash
        run: |
          echo "## Test Results: ${{ inputs.platform }} (${{ env.EFFECTIVE_BUILD_TYPE }}, ${{ env.CACHE_LIB_TYPE }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$BUILD_DIR/test-results.xml" ]; then
              echo "See JUnit artifact / annotations." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate lcov coverage report
        if: runner.os == 'Linux' && inputs.enable_coverage
        run: |
          lcov --capture --directory "$BUILD_DIR" --output-file coverage.info \
            --ignore-errors mismatch,unused,empty
          lcov --remove coverage.info \
            '/usr/*' '*/tests/*' '*/examples/*' '*/deps/external/*' '*/deps/internal/*' \
            '*/_deps/*' '*/googletest/*' '*/googlemock/*' \
            --output-file coverage.info --ignore-errors mismatch,unused
          lcov --list coverage.info --ignore-errors mismatch,unused

      - name: Generate HTML coverage report
        if: runner.os == 'Linux' && inputs.enable_coverage
        run: genhtml coverage.info --output-directory coverage-html

      - name: Upload coverage HTML
        if: runner.os == 'Linux' && inputs.enable_coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ inputs.platform }}
          path: coverage-html/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && inputs.enable_coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.codecov_token }}
          slug: vertexnova/vnewindow
          files: ./coverage.info
          fail_ci_if_error: false
          verbose: true
          flags: ${{ inputs.platform }}
